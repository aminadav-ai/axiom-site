<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Axiom Capsule Browser v1.0 — Capability Gatekeeper &amp; Legacy HTML Clean-Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="ui-canvas" aria-label="Axiom Capsule Browser Prototype on Axiom-UI"></canvas>
  <div id="fallback-msg" class="fallback" hidden></div>
  <script type="module">
    import { mountAxiomUiApp } from './gpu_ui.js';
    mountAxiomUiApp({
      canvas: document.getElementById('ui-canvas'),
      wasmUrl: './capsule_browser.wasm',
      fallbackEl: document.getElementById('fallback-msg'),
    });
  </script>
</body>
</html>
