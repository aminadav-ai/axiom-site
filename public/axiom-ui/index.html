<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Axiom-UI v1.0 — Zero-DOM, Zero-CSS, Zero-Electron Hardware GPU UI Engine</title>

</head>
<body>
  <canvas id="ui-canvas" aria-label="Axiom-UI Zero-DOM Hardware GPU Interactive Component Gallery"></canvas>

      canvas: document.getElementById('ui-canvas'),
      wasmUrl: './axiom_ui.wasm',
      fallbackEl: document.getElementById('fallback-msg'),
    });
  </script>
